name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 #v4.1.0
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: GOOS=darwin GOARCH=arm64 mise build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: macform-darwin-arm64
          path: bin/macform
      - name: Build integration test binary
        run: GOOS=darwin GOARCH=arm64 mise run build-integration-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: integration-test
          path: bin/integration.test

  integration:
    needs: build
    runs-on: getmac-tahoe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 #v7.0.0
        with:
          name: macform-darwin-arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 #v7.0.0
        with:
          name: integration-test
          path: integration
      - name: Make executables
        run: chmod +x macform integration/integration.test
      - name: Integration tests
        working-directory: integration
        run: ./integration.test -test.v
        env:
          MACFORM: ${{ github.workspace }}/macform
