[env]
_.file = ".env"
HK_MISE = 1

[tools]
go = "1.26"
goreleaser = "2.15.4"
hk = "1.44.3"
pkl = "0.31.1"

[settings]
experimental = true

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build the binary"
run = "go build -o bin/macform main.go"

[tasks.build-integration-test]
description = "Build integration test binary"
run = "go test -c -tags=integration -o bin/integration.test ./integration/"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.integration-test]
description = "Run integration tests"
depends = ["build"]
run = "MACFORM=$PWD/bin/macform go test -tags=integration -v -count=1 ./integration/..."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.plan]
description = "Run macform plan"
depends = ["build"]
run = "bin/macform plan"

[tasks.apply]
description = "Run macform apply"
depends = ["build"]
run = "bin/macform apply"
